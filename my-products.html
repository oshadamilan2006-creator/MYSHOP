<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MYSHOP - My Products</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, "Noto Sans Sinhala", sans-serif;
    background: #0b0b12;
    color: white;
}

header {
    background: #11111b;
    border-bottom: 1px solid #292936;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #a855f7;
    font-size: 26px;
    font-weight: bold;
}

.back {
    color: #ddd;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 30px 18px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

h1 {
    font-size: 30px;
}

.add {
    background: #8b5cf6;
    color: white;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 9px;
    font-weight: bold;
}

.list {
    display: grid;
    gap: 15px;
}

.product {
    background: #15151f;
    border: 1px solid #292936;
    border-radius: 14px;
    padding: 18px;
}

.product-main {
    display: flex;
    gap: 18px;
    align-items: center;
}

.product img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    background: #22222d;
}

.no-image {
    width: 100px;
    height: 100px;
    border-radius: 10px;
    background: #22222d;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    text-align: center;
    font-size: 13px;
}

.info {
    flex: 1;
}

.name {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 7px;
}

.price {
    color: #c084fc;
    font-weight: bold;
    margin-bottom: 6px;
}

.stock {
    color: #999;
    margin-bottom: 6px;
}

.description {
    color: #888;
    line-height: 1.5;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #292936;
}

.action-btn {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.edit {
    background: #2563eb;
}

.delete {
    background: #dc2626;
}

.action-btn:hover {
    opacity: 0.85;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #777;
    background: #14141d;
    border-radius: 14px;
}

.loading {
    text-align: center;
    color: #999;
    padding: 30px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    padding: 20px;
    z-index: 999;
}

.modal-box {
    max-width: 500px;
    margin: 60px auto;
    background: #15151f;
    border: 1px solid #292936;
    border-radius: 16px;
    padding: 25px;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #ddd;
}

.form-group input,
.form-group textarea {
    width: 100%;
    background: #0b0b12;
    color: white;
    border: 1px solid #353542;
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

.form-group textarea {
    min-height: 90px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.save-btn {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 8px;
    background: #8b5cf6;
    color: white;
    font-weight: bold;
}

.cancel-btn {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 8px;
    background: #33333f;
    color: white;
}

@media(max-width:600px) {

    .top {
        align-items: flex-start;
        flex-direction: column;
    }

    .product-main {
        align-items: flex-start;
    }

    .product img,
    .no-image {
        width: 80px;
        height: 80px;
    }

    .actions {
        flex-direction: column;
    }

    .action-btn {
        width: 100%;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        MYSHOP
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</header>


<div class="container">


    <div class="top">

        <h1>
            📦 My Products
        </h1>

        <a
            href="products.html"
            class="add"
        >
            ➕ Add Product
        </a>

    </div>


    <div
        id="productList"
        class="list"
    >

        <div class="loading">
            Products loading...
        </div>

    </div>


</div>


<!-- EDIT MODAL -->

<div
    id="editModal"
    class="modal"
>

    <div class="modal-box">

        <h2>
            ✏️ Edit Product
        </h2>


        <div class="form-group">

            <label>
                Product Name
            </label>

            <input
                id="editName"
                type="text"
            >

        </div>


        <div class="form-group">

            <label>
                Price
            </label>

            <input
                id="editPrice"
                type="number"
            >

        </div>


        <div class="form-group">

            <label>
                Stock
            </label>

            <input
                id="editStock"
                type="number"
            >

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="editDescription"
            ></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="save-btn"
                onclick="saveEdit()"
            >
                💾 Save
            </button>

            <button
                class="cancel-btn"
                onclick="closeEdit()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<script>

const API =
    "https://myshop-api.oshadamilan2006.workers.dev/";


/* LOGIN */

const savedBusiness =
    localStorage.getItem(
        "myshop_business"
    );


if (!savedBusiness) {

    window.location.href =
        "login.html";

}


let business;


try {

    business =
        JSON.parse(savedBusiness);

} catch (error) {

    localStorage.removeItem(
        "myshop_business"
    );

    window.location.href =
        "login.html";

}


let currentProductId = null;


/* LOAD PRODUCTS */

async function loadProducts() {

    const list =
        document.getElementById(
            "productList"
        );


    list.innerHTML =
        '<div class="loading">⏳ Loading...</div>';


    try {

        const response =
            await fetch(
                API,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "get_products",

                            business_id:
                                business.id

                        })

                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            list.innerHTML =
                `<div class="empty">
                    ❌ ${escapeHTML(
                        result.error || ""
                    )}
                </div>`;

            return;

        }


        if (
            !result.products ||
            result.products.length === 0
        ) {

            list.innerHTML =
                `<div class="empty">
                    📦 තවම Products නැහැ.
                    <br><br>
                    <a
                        href="products.html"
                        style="color:#c084fc;"
                    >
                        ➕ Product එකක් එකතු කරන්න
                    </a>
                </div>`;

            return;

        }


        list.innerHTML = "";


        result.products.forEach(
            function(product) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "product";


                let imageHTML = `
                    <div class="no-image">
                        🖼️<br>
                        No Image
                    </div>
                `;


                if (
                    product.image_url
                ) {

                    imageHTML = `
                        <img
                            src="${escapeHTML(
                                product.image_url
                            )}"
                            alt="${escapeHTML(
                                product.name
                            )}"
                        >
                    `;

                }


                item.innerHTML = `

                    <div class="product-main">

                        ${imageHTML}

                        <div class="info">

                            <div class="name">
                                ${escapeHTML(
                                    product.name
                                )}
                            </div>

                            <div class="price">
                                Rs.
                                ${Number(
                                    product.price
                                ).toLocaleString()}
                            </div>

                            <div class="stock">
                                📦 Stock:
                                ${product.stock}
                            </div>

                            <div class="description">
                                ${escapeHTML(
                                    product.description || ""
                                )}
                            </div>

                        </div>

                    </div>


                    <div class="actions">

                        <button
                            class="action-btn edit"
                            onclick="openEdit(
                                '${escapeJS(product.id)}',
                                '${escapeJS(product.name)}',
                                '${product.price}',
                                '${product.stock}',
                                '${escapeJS(
                                    product.description || ""
                                )}'
                            )"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="action-btn delete"
                            onclick="deleteProduct(
                                '${escapeJS(product.id)}'
                            )"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                `;


                list.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(error);

        list.innerHTML =
            `<div class="empty">
                ❌ Server එකට connect වෙන්න බැරි වුණා.
            </div>`;

    }

}


/* OPEN EDIT */

function openEdit(
    id,
    name,
    price,
    stock,
    description
) {

    currentProductId =
        id;


    document.getElementById(
        "editName"
    ).value =
        name;


    document.getElementById(
        "editPrice"
    ).value =
        price;


    document.getElementById(
        "editStock"
    ).value =
        stock;


    document.getElementById(
        "editDescription"
    ).value =
        description;


    document.getElementById(
        "editModal"
    ).style.display =
        "block";

}


/* CLOSE EDIT */

function closeEdit() {

    document.getElementById(
        "editModal"
    ).style.display =
        "none";

    currentProductId =
        null;

}


/* SAVE EDIT */

async function saveEdit() {

    if (!currentProductId) {
        return;
    }


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "editPrice"
            ).value
        );


    const stock =
        Number(
            document.getElementById(
                "editStock"
            ).value
        );


    const description =
        document.getElementById(
            "editDescription"
        ).value.trim();


    if (!name) {

        alert(
            "Product Name එක දාන්න."
        );

        return;

    }


    try {

        const response =
            await fetch(
                API,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "update_product",

                            business_id:
                                business.id,

                            product_id:
                                currentProductId,

                            name:
                                name,

                            price:
                                price,

                            stock:
                                stock,

                            description:
                                description

                        })

                }
            );


        const result =
            await response.json();


        if (
            result.success
        ) {

            alert(
                "✅ Product එක update කළා!"
            );

            closeEdit();

            loadProducts();

        }
        else {

            alert(
                "❌ " +
                (
                    result.error ||
                    "Update failed"
                )
            );

        }


    } catch (error) {

        console.error(error);

        alert(
            "❌ Server error"
        );

    }

}


/* DELETE */

async function deleteProduct(id) {

    const confirmDelete =
        confirm(
            "මේ Product එක Delete කරන්නද?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                API,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "delete_product",

                            business_id:
                                business.id,

                            product_id:
                                id

                        })

                }
            );


        const result =
            await response.json();


        if (
            result.success
        ) {

            alert(
                "🗑️ Product එක Delete කළා!"
            );

            loadProducts();

        }
        else {

            alert(
                "❌ " +
                (
                    result.error ||
                    "Delete failed"
                )
            );

        }


    } catch (error) {

        console.error(error);

        alert(
            "❌ Server error"
        );

    }

}


/* ESCAPE HTML */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ESCAPE JS */

function escapeJS(value) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            ""
        );

}


/* START */

loadProducts();

</script>


</body>

</html>
