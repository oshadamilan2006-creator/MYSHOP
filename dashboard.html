<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYSHOP Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Noto Sans Sinhala", sans-serif;
    background: #0b0b12;
    color: white;
}

header {
    height: 70px;
    background: #11111b;
    border-bottom: 1px solid #292936;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #a855f7;
}

.logout {
    background: #25151a;
    border: 1px solid #6b2737;
    color: #ff8f9d;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.container {
    display: flex;
    min-height: calc(100vh - 70px);
}

.sidebar {
    width: 240px;
    background: #101018;
    border-right: 1px solid #292936;
    padding: 25px 15px;
}

.sidebar button {
    width: 100%;
    text-align: left;
    padding: 13px 15px;
    margin-bottom: 8px;
    background: transparent;
    border: none;
    color: #aaa;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
}

.sidebar button:hover,
.sidebar button.active {
    background: #25183b;
    color: #c084fc;
}

.main {
    flex: 1;
    padding: 35px 5%;
}

.welcome {
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.welcome p {
    color: #9999a8;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: #14141d;
    border: 1px solid #292936;
    border-radius: 15px;
    padding: 25px;
}

.card-icon {
    font-size: 30px;
    margin-bottom: 15px;
}

.card h3 {
    margin-bottom: 8px;
}

.card p {
    color: #9999a8;
    font-size: 14px;
}

.store-box {
    background: #14141d;
    border: 1px solid #292936;
    border-radius: 15px;
    padding: 25px;
}

.store-box h2 {
    margin-bottom: 15px;
}

.store-link {
    background: #0d0d14;
    border: 1px solid #353542;
    padding: 14px;
    border-radius: 8px;
    color: #c084fc;
    word-break: break-all;
    margin-bottom: 15px;
}

.copy-btn {
    background: #8b5cf6;
    border: none;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
}

.mobile-menu {
    display: none;
}

@media (max-width: 800px) {

    .sidebar {
        width: 190px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    header {
        padding: 0 5%;
    }

    .container {
        display: block;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #292936;
        display: flex;
        overflow-x: auto;
        padding: 10px;
    }

    .sidebar button {
        min-width: 130px;
        margin: 0 5px 0 0;
        white-space: nowrap;
    }

    .main {
        padding: 25px 18px;
    }

    .welcome h1 {
        font-size: 26px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        MYSHOP
    </div>

    <button
        class="logout"
        onclick="logout()"
    >
        🚪 ඉවත් වන්න
    </button>

</header>


<div class="container">

    <aside class="sidebar">

        <button class="active">
            🏠 Dashboard
        </button>

        <button>
            🏪 My Store
        </button>

        <a href="products.html" class="add-product-btn">
    ➕ Add Product
</a>

        <button>
            📦 Orders
        </button>

        <button>
            💰 Prices
        </button>

        <button>
            ⚙️ Store Settings
        </button>

        <button>
            💳 Subscription
        </button>

    </aside>


    <main class="main">

        <div class="welcome">

            <h1 id="welcome">
                ආයුබෝවන් 👋
            </h1>

            <p id="businessInfo">
                ඔබේ MYSHOP Dashboard එකට සාදරයෙන් පිළිගනිමු.
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <div class="card-icon">
                    🏪
                </div>

                <h3>
                    My Store
                </h3>

                <p>
                    ඔබේ Online වෙළඳසැල කළමනාකරණය කරන්න.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    📦
                </div>

                <h3>
                    Orders
                </h3>

                <p>
                    ඔබේ customers ගේ orders මෙතැනින් බලන්න.
                </p>

            </div>


            <div class="card">

                <div class="card-icon">
                    🛍️
                </div>

                <h3>
                    Products
                </h3>

                <p>
                    Products එකතු කරන්න සහ වෙනස් කරන්න.
                </p>

            </div>

        </div>


        <div class="store-box">

            <h2>
                🔗 ඔබේ Store Link
            </h2>

            <div
                class="store-link"
                id="storeLink"
            >
                Loading...
            </div>

            <button
                class="copy-btn"
                onclick="copyStoreLink()"
            >
                📋 Link එක Copy කරන්න
            </button>

        </div>

    </main>

</div>


<script>

/* ===================================
   CHECK LOGIN
=================================== */

const savedBusiness =
    localStorage.getItem("myshop_business");


if (!savedBusiness) {

    window.location.href =
        "login.html";

}


/* ===================================
   BUSINESS DATA
=================================== */

let business;

try {

    business =
        JSON.parse(savedBusiness);

} catch (error) {

    localStorage.removeItem(
        "myshop_business"
    );

    window.location.href =
        "login.html";

}


/* ===================================
   SHOW BUSINESS
=================================== */

if (business) {

    document.getElementById(
        "welcome"
    ).textContent =
        "ආයුබෝවන්, " +
        business.business_name +
        " 👋";


    document.getElementById(
        "businessInfo"
    ).textContent =
        "ඔබේ MYSHOP Dashboard එකට සාදරයෙන් පිළිගනිමු.";


    const storeURL =
        window.location.origin +
        "/MYSHOP/shop/" +
        business.store_slug;


    document.getElementById(
        "storeLink"
    ).textContent =
        storeURL;

}


/* ===================================
   COPY STORE LINK
=================================== */

function copyStoreLink() {

    const link =
        document.getElementById(
            "storeLink"
        ).textContent;


    navigator.clipboard
    .writeText(link)
    .then(function() {

        alert(
            "✅ Store link එක Copy කළා!"
        );

    })
    .catch(function() {

        alert(
            "Store link එක manually copy කරන්න."
        );

    });

}


/* ===================================
   LOGOUT
=================================== */

function logout() {

    localStorage.removeItem(
        "myshop_business"
    );

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
