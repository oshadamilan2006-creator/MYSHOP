<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MYSHOP Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                "Noto Sans Sinhala",
                sans-serif;

            background: #0b0b12;
            color: white;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 72px;

            background: #11111a;

            border-bottom:
                1px solid #272733;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 25px;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .logo {
            font-size: 25px;

            font-weight: 800;

            color: #a855f7;
        }

        .logout {
            background: #24141b;

            color: #ff9aa2;

            border:
                1px solid #54212b;

            border-radius: 10px;

            padding:
                11px 18px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        .logout:hover {
            background: #351720;
        }


        /* =========================
           LAYOUT
        ========================= */

        .container {
            display: flex;

            min-height:
                calc(100vh - 72px);
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 230px;

            background: #101018;

            border-right:
                1px solid #272733;

            padding: 18px;

            flex-shrink: 0;
        }

        .sidebar > button,
        .sidebar > a {
            width: 100%;

            min-height: 50px;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 9px;

            margin-bottom: 10px;

            padding:
                13px 15px;

            border: none;

            border-radius: 12px;

            background: #171720;

            color: #d1d1dc;

            font-size: 15px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform .2s,
                background .2s,
                color .2s;
        }

        .sidebar > button:hover,
        .sidebar > a:hover {
            background: #22222e;

            color: white;

            transform:
                translateY(-1px);
        }

        .sidebar > button.active {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            color: white;

            box-shadow:
                0 6px 18px
                rgba(
                    124,
                    58,
                    237,
                    .25
                );
        }


        /* =========================
           PRODUCT BUTTONS
        ========================= */

        .dashboard-buttons {
            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-bottom: 10px;
        }

        .dashboard-btn {
            width: 100%;

            min-height: 50px;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            padding:
                13px 15px;

            border-radius: 12px;

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            transition: .2s;
        }

        .dashboard-btn:hover {
            transform:
                translateY(-1px);
        }

        .add-product {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            box-shadow:
                0 6px 18px
                rgba(
                    124,
                    58,
                    237,
                    .20
                );
        }

        .my-products {
            background:
                linear-gradient(
                    135deg,
                    #0891b2,
                    #06b6d4
                );

            box-shadow:
                0 6px 18px
                rgba(
                    6,
                    182,
                    212,
                    .15
                );
        }


        /* =========================
           NOTIFICATION BUTTON
        ========================= */

        .notification-btn {
            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #a855f7
                ) !important;

            color: white !important;

            border: none !important;

            box-shadow:
                0 6px 18px
                rgba(
                    124,
                    58,
                    237,
                    .25
                );
        }

        .notification-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #c084fc
                ) !important;

            transform:
                translateY(-2px) !important;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;

            padding:
                35px;

            min-width: 0;
        }

        .welcome {
            margin-bottom: 28px;
        }

        .welcome h1 {
            margin:
                0 0 8px;

            font-size: 32px;
        }

        .welcome p {
            margin: 0;

            color: #8d8d9b;

            font-size: 16px;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: 18px;

            margin-bottom: 25px;
        }

        .card {
            background: #15151f;

            border:
                1px solid #292936;

            border-radius: 18px;

            padding: 25px;

            min-height: 180px;

            transition: .2s;
        }

        .card:hover {
            border-color:
                #55347d;

            transform:
                translateY(-3px);
        }

        .card-link {
            display: block;

            text-decoration: none;

            color: inherit;
        }

        .card-icon {
            font-size: 38px;

            margin-bottom: 15px;
        }

        .card h3 {
            margin:
                0 0 10px;

            font-size: 22px;

            color: white;
        }

        .card p {
            margin: 0;

            color: #858594;

            line-height: 1.6;

            font-size: 15px;
        }


        /* =========================
           STORE BOX
        ========================= */

        .store-box {
            background: #15151f;

            border:
                1px solid #292936;

            border-radius: 18px;

            padding: 25px;

            margin-top: 20px;
        }

        .store-box h2 {
            margin-top: 0;

            font-size: 21px;
        }

        .store-link {
            background: #0d0d15;

            border:
                1px solid #292936;

            border-radius: 10px;

            padding: 14px;

            color: #c084fc;

            word-break: break-all;

            margin:
                15px 0;
        }

        .copy-btn {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            color: white;

            border: none;

            border-radius: 10px;

            padding:
                12px 18px;

            font-weight: bold;

            cursor: pointer;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            header {
                padding:
                    0 15px;
            }

            .logo {
                font-size: 23px;
            }

            .container {
                display: block;
            }

            .sidebar {
                width: 100%;

                border-right: none;

                border-bottom:
                    1px solid #272733;

                display: grid;

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 8px;

                padding: 12px;
            }

            .sidebar > button,
            .sidebar > a,
            .dashboard-buttons {
                margin: 0;
            }

            .dashboard-buttons {
                gap: 8px;
            }

            .sidebar > button,
            .sidebar > a,
            .dashboard-btn {
                min-height: 54px;

                margin: 0;
            }

            .main {
                padding:
                    25px 15px;
            }

            .cards {
                grid-template-columns:
                    1fr;
            }

            .welcome h1 {
                font-size: 27px;
            }

        }


        @media (max-width: 450px) {

            header {
                height: 65px;
            }

            .logout {
                padding:
                    9px 12px;

                font-size: 13px;
            }

            .sidebar {
                grid-template-columns:
                    1fr 1fr;
            }

            .sidebar > button,
            .sidebar > a,
            .dashboard-btn {
                font-size: 13px;

                padding:
                    11px 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        MYSHOP
    </div>

    <button
        class="logout"
        onclick="logout()"
    >
        🚪 ඉවත් වන්න
    </button>

</header>



<div class="container">


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">


        <button class="active">
            🏠 Dashboard
        </button>


        <button>
            🏪 My Store
        </button>


        <div class="dashboard-buttons">

            <a
                href="products.html"
                class="dashboard-btn add-product"
            >
                ➕ Add Product
            </a>


            <a
                href="my-products.html"
                class="dashboard-btn my-products"
            >
                📦 My Products
            </a>

        </div>


        <!-- NOTIFICATION -->

        <button
            class="notification-btn"
            onclick="enableNotifications()"
        >
            🔔 Notifications
        </button>


        <!-- ORDERS -->

        <button
            onclick="
                window.location.href='orders.html'
            "
        >
            📦 Orders
        </button>


        <button>
            💰 Prices
        </button>


        <button>
            ⚙️ Store Settings
        </button>


        <button>
            💳 Subscription
        </button>


    </aside>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <div class="welcome">

            <h1 id="welcome">
                ආයුබෝවන් 👋
            </h1>

            <p id="businessInfo">
                ඔබේ MYSHOP Dashboard එකට
                සාදරයෙන් පිළිගනිමු.
            </p>

        </div>



        <!-- =========================
             DASHBOARD CARDS
        ========================= -->

        <div class="cards">


            <!-- MY STORE -->

            <div class="card">

                <div class="card-icon">
                    🏪
                </div>

                <h3>
                    My Store
                </h3>

                <p>
                    ඔබේ Online වෙළඳසැල
                    කළමනාකරණය කරන්න.
                </p>

            </div>



            <!-- ORDERS -->

            <a
                href="orders.html"
                class="card card-link"
            >

                <div class="card-icon">
                    📦
                </div>

                <h3>
                    Orders
                </h3>

                <p>
                    ඔබේ customers ගේ
                    orders මෙතැනින් බලන්න.
                </p>

            </a>



            <!-- PRODUCTS -->

            <a
                href="my-products.html"
                class="card card-link"
            >

                <div class="card-icon">
                    🛍️
                </div>

                <h3>
                    Products
                </h3>

                <p>
                    Products එකතු කරන්න
                    සහ වෙනස් කරන්න.
                </p>

            </a>


        </div>



        <!-- =========================
             STORE LINK
        ========================= -->

        <div class="store-box">

            <h2>
                🔗 ඔබේ Store Link
            </h2>


            <div
                class="store-link"
                id="storeLink"
            >
                Loading...
            </div>


            <button
                class="copy-btn"
                onclick="copyStoreLink()"
            >
                📋 Link එක Copy කරන්න
            </button>

        </div>


    </main>

</div>



<script>


/* =========================
   BUSINESS SESSION
========================= */

let business = null;


function getBusiness() {

    const value =
        localStorage.getItem(
            "myshop_business"
        );


    if (!value) {
        return null;
    }


    try {

        return JSON.parse(value);

    } catch (error) {

        console.error(error);

        return null;

    }

}


business =
    getBusiness();


if (!business) {

    window.location.href =
        "login.html";

}


/* =========================
   WELCOME
========================= */

if (business) {

    const name =
        business.business_name ||
        business.name ||
        "Business";


    document.getElementById(
        "welcome"
    ).textContent =
        "ආයුබෝවන්, " +
        name +
        " 👋";


    document.getElementById(
        "businessInfo"
    ).textContent =
        "ඔබේ MYSHOP Dashboard එකට සාදරයෙන් පිළිගනිමු.";


    /* Store link */

    const slug =
        business.store_slug;


    if (slug) {

        const storeUrl =
            window.location.origin +
            "/store.html?store=" +
            encodeURIComponent(
                slug
            );


        document.getElementById(
            "storeLink"
        ).textContent =
            storeUrl;

    } else {

        document.getElementById(
            "storeLink"
        ).textContent =
            "Store link එක තවම සෑදී නැහැ.";

    }

}


/* =========================
   COPY STORE LINK
========================= */

function copyStoreLink() {

    const text =
        document.getElementById(
            "storeLink"
        ).textContent;


    if (
        !text ||
        text.includes(
            "තවම"
        )
    ) {

        return;

    }


    navigator.clipboard
        .writeText(text)
        .then(
            function() {

                alert(
                    "✅ Store link එක Copy කරා!"
                );

            }
        )
        .catch(
            function() {

                alert(
                    "❌ Link එක Copy කරන්න බැරි වුණා."
                );

            }
        );

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "myshop_business"
    );


    window.location.href =
        "login.html";

}


/* =========================
   NOTIFICATIONS
========================= */

async function enableNotifications() {

    if (!("Notification" in window)) {
        alert("❌ මේ browser එක Notifications support කරන්නේ නැහැ.");
        return;
    }

    if (!("serviceWorker" in navigator)) {
        alert("❌ Service Worker support නැහැ.");
        return;
    }

    if (!business || !business.id) {
        alert("❌ Business login session එක හමු වුණේ නැහැ.");
        return;
    }

    try {

        const permission =
            await Notification.requestPermission();

        if (permission !== "granted") {
            alert("❌ Notifications Allow කරන්න.");
            return;
        }

        const registration =
            await navigator.serviceWorker.register(
                "/service-worker.js"
            );

        const vapidPublicKey =
            "BPTUVGOMFm-e0z32p5ki8rofnOka4N8zOcAxLxIIesC-3unXR5cR536g-LsIHJHPCGc7TnZTYzY4GOU52efSh4s";


        function urlBase64ToUint8Array(base64String) {

            const padding =
                "=".repeat(
                    (4 - base64String.length % 4) % 4
                );

            const base64 =
                (
                    base64String +
                    padding
                )
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            const rawData =
                window.atob(base64);

            const outputArray =
                new Uint8Array(
                    rawData.length
                );

            for (
                let i = 0;
                i < rawData.length;
                ++i
            ) {
                outputArray[i] =
                    rawData.charCodeAt(i);
            }

            return outputArray;
        }


        let subscription =
            await registration.pushManager.getSubscription();


        if (!subscription) {

            subscription =
                await registration.pushManager.subscribe({

                    userVisibleOnly: true,

                    applicationServerKey:
                        urlBase64ToUint8Array(
                            vapidPublicKey
                        )

                });

        }


        const response =
            await fetch(
                "https://myshop-api.oshadamilan2006.workers.dev/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        action:
                            "save_push_subscription",

                        business_id:
                            business.id,

                        subscription:
                            subscription.toJSON()

                    })

                }
            );


        const result =
            await response.json();


        if (result.success) {

            alert(
                "🔔 Notifications සාර්ථකව ON කරා!"
            );

        } else {

            alert(
                "❌ " +
                (
                    result.error ||
                    "Notification save failed"
                )
            );

        }

    } catch (error) {

    console.error(
        "Notification error:",
        error
    );

    alert(
        "❌ Notification Error:\n\n" +
        error.name +
        "\n\n" +
        error.message
    );

}
    </script>

</body>
</html>
