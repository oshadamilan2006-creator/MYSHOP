<!DOCTYPE html>
<html lang="si">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders - MYSHOP</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Sinhala", sans-serif;
    background: #0b0b12;
    color: white;
}

header {
    background: #15151f;
    border-bottom: 1px solid #292936;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #a855f7;
    font-size: 24px;
    font-weight: bold;
}

.back-btn {
    background: #292936;
    color: white;
    border: 0;
    padding: 10px 15px;
    border-radius: 9px;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px 16px 60px;
}

.title {
    font-size: 28px;
    margin-bottom: 5px;
}

.subtitle {
    color: #888;
    margin-bottom: 25px;
}

.loading,
.empty,
.error {
    background: #15151f;
    border: 1px solid #292936;
    border-radius: 15px;
    padding: 40px 20px;
    text-align: center;
    color: #aaa;
}

.order {
    background: #15151f;
    border: 1px solid #292936;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.order-number {
    font-size: 20px;
    font-weight: bold;
}

.status {
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.pending {
    background: #5b4300;
    color: #ffd666;
}

.completed {
    background: #064e3b;
    color: #6ee7b7;
}

.cancelled {
    background: #5f1515;
    color: #ff9999;
}

.order-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 15px;
}

.info {
    background: #0d0d15;
    border-radius: 10px;
    padding: 12px;
}

.info-title {
    color: #888;
    font-size: 13px;
    margin-bottom: 5px;
}

.info-value {
    font-weight: bold;
    word-break: break-word;
}

.total {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #292936;
    color: #c084fc;
    font-size: 21px;
    font-weight: bold;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.actions button {
    border: 0;
    color: white;
    padding: 11px 15px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.complete {
    background: #059669;
}

.cancel {
    background: #dc2626;
}

.whatsapp {
    background: #25D366;
}

.refresh {
    background: #7c3aed;
    border: 0;
    color: white;
    padding: 11px 17px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
}

</style>
</head>


<body>

<header>

<div class="logo">
MYSHOP 📦
</div>

<a
href="javascript:history.back()"
class="back-btn">

← Back

</a>

</header>


<div class="container">

<div class="title">
📦 Orders
</div>

<div class="subtitle">
ඔයාගේ Store එකට ලැබුණු Orders
</div>

<button
class="refresh"
onclick="loadOrders()">

🔄 Refresh Orders

</button>


<div id="ordersBox">

<div class="loading">
⏳ Orders loading...
</div>

</div>

</div>


<script>

const API =
"https://myshop-api.oshadamilan2006.workers.dev/";


/*
========================================
GET BUSINESS SESSION
========================================
*/

function getBusiness() {

    const possibleKeys = [
        "business",
        "businessData",
        "user",
        "userData",
        "loggedInBusiness",
        "currentBusiness"
    ];

    for (
        let i = 0;
        i < possibleKeys.length;
        i++
    ) {

        const key =
            possibleKeys[i];

        const value =
            localStorage.getItem(key);

        if (!value) {
            continue;
        }

        try {

            const parsed =
                JSON.parse(value);

            if (
                parsed &&
                (
                    parsed.id ||
                    parsed.business_id
                )
            ) {

                return parsed;

            }

        } catch (error) {

            console.log(
                "Invalid localStorage:",
                key
            );

        }

    }

    return null;
}


let business =
    getBusiness();


/*
========================================
IF BUSINESS NOT FOUND
========================================
*/

if (!business) {

    document.getElementById(
        "ordersBox"
    ).innerHTML = `

        <div class="error">

            ❌ Business login session එක
            හමු වුණේ නැහැ.

            <br><br>

            Dashboard එකෙන් logout වෙලා
            නැවත login වෙන්න.

        </div>

    `;

} else {

    loadOrders();

}


/*
========================================
LOAD ORDERS
========================================
*/

async function loadOrders() {

    business =
        getBusiness();

    if (!business) {

        showError(
            "Business login session එක හමු වුණේ නැහැ."
        );

        return;

    }


    const businessId =
        Number(
            business.id ||
            business.business_id
        );


    if (!businessId) {

        showError(
            "Business ID එක හමු වුණේ නැහැ."
        );

        return;

    }


    document.getElementById(
        "ordersBox"
    ).innerHTML = `

        <div class="loading">

            ⏳ Orders loading...

        </div>

    `;


    try {

        const response =
            await fetch(
                API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        action:
                        "get_orders",

                        business_id:
                        businessId

                    })
                }
            );


        const result =
            await response.json();


        if (!result.success) {

            showError(
                result.error ||
                "Orders load failed."
            );

            return;

        }


        const orders =
            result.orders || [];


        if (
            orders.length === 0
        ) {

            document.getElementById(
                "ordersBox"
            ).innerHTML = `

                <div class="empty">

                    📦 තවම Orders නැහැ.

                </div>

            `;

            return;

        }


        displayOrders(
            orders
        );


    } catch (error) {

        console.error(error);

        showError(
            "Server එකට connect වෙන්න බැරි වුණා."
        );

    }

}


/*
========================================
DISPLAY ORDERS
========================================
*/

function displayOrders(
    orders
) {

    const box =
        document.getElementById(
            "ordersBox"
        );


    box.innerHTML = "";


    orders.forEach(
        function(order) {


            let statusClass =
                "pending";

            let statusText =
                "🟡 Pending";


            if (
                order.status ===
                "completed"
            ) {

                statusClass =
                    "completed";

                statusText =
                    "🟢 Completed";

            }


            if (
                order.status ===
                "cancelled"
            ) {

                statusClass =
                    "cancelled";

                statusText =
                    "🔴 Cancelled";

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order";


            card.innerHTML = `

                <div class="order-header">

                    <div class="order-number">

                        Order #${order.id}

                    </div>

                    <div class="status ${statusClass}">

                        ${statusText}

                    </div>

                </div>


                <div class="order-grid">


                    <div class="info">

                        <div class="info-title">
                            📦 Product
                        </div>

                        <div class="info-value">
                            ${safe(
                                order.product_name
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-title">
                            👤 Customer
                        </div>

                        <div class="info-value">
                            ${safe(
                                order.customer_name
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-title">
                            📱 Phone
                        </div>

                        <div class="info-value">
                            ${safe(
                                order.phone
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-title">
                            💬 WhatsApp
                        </div>

                        <div class="info-value">
                            ${safe(
                                order.whatsapp ||
                                "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-title">
                            🏠 Address
                        </div>

                        <div class="info-value">
                            ${safe(
                                order.address
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-title">
                            🏙️ City
                        </div>

                        <div class="info-value">
                            ${safe(
                                order.city
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-title">
                            🔢 Quantity
                        </div>

                        <div class="info-value">
                            ${order.quantity}
                        </div>

                    </div>


                    <div class="info">

                        <div class="info-title">
                            🕐 Date
                        </div>

                        <div class="info-value">
                            ${formatDate(
                                order.created_at
                            )}
                        </div>

                    </div>


                </div>


                <div class="total">

                    💰 Total:
                    Rs.
                    ${Number(
                        order.total
                    ).toLocaleString()}

                </div>


                <div class="actions">


                    ${
                        order.status !==
                        "completed"
                        ?
                        `
                        <button
                        class="complete"
                        onclick="
                        updateStatus(
                            ${order.id},
                            'completed'
                        )">

                        🟢 Complete

                        </button>
                        `
                        :
                        ""
                    }


                    ${
                        order.status !==
                        "cancelled"
                        ?
                        `
                        <button
                        class="cancel"
                        onclick="
                        updateStatus(
                            ${order.id},
                            'cancelled'
                        )">

                        🔴 Cancel

                        </button>
                        `
                        :
                        ""
                    }


                    ${
                        order.whatsapp
                        ?
                        `
                        <button
                        class="whatsapp"
                        onclick="
                        openCustomerWhatsApp(
                            '${escapeJS(
                                order.whatsapp
                            )}',
                            ${order.id}
                        )">

                        📲 WhatsApp Customer

                        </button>
                        `
                        :
                        ""
                    }


                </div>

            `;


            box.appendChild(
                card
            );

        }
    );

}


/*
========================================
UPDATE STATUS
========================================
*/

async function updateStatus(
    orderId,
    status
) {

    business =
        getBusiness();


    if (!business) {

        alert(
            "Login session එක නැහැ."
        );

        return;

    }


    const businessId =
        Number(
            business.id ||
            business.business_id
        );


    try {

        const response =
            await fetch(
                API,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({

                        action:
                        "update_order_status",

                        business_id:
                        businessId,

                        order_id:
                        orderId,

                        status:
                        status

                    })

                }
            );


        const result =
            await response.json();


        if (!result.success) {

            alert(
                "❌ " +
                (
                    result.error ||
                    "Update failed"
                )
            );

            return;

        }


        loadOrders();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Server error"
        );

    }

}


/*
========================================
WHATSAPP CUSTOMER
========================================
*/

function openCustomerWhatsApp(
    number,
    orderId
) {

    let phone =
        String(number)
        .replace(
            /[^0-9]/g,
            ""
        );


    if (
        phone.startsWith("0")
    ) {

        phone =
            "94" +
            phone.substring(1);

    }


    const message =
        `Hello, regarding your Order #${orderId} from MYSHOP.`;


    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

}


/*
========================================
HELPERS
========================================
*/

function safe(
    value
) {

    return String(
        value || ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


function escapeJS(
    value
) {

    return String(
        value || ""
    )

    .replaceAll(
        "\\",
        "\\\\"
    )

    .replaceAll(
        "'",
        "\\'"
    );

}


function formatDate(
    date
) {

    if (!date) {
        return "-";
    }

    return new Date(
        date
    ).toLocaleString(
        "en-LK"
    );

}


function showError(
    message
) {

    document.getElementById(
        "ordersBox"
    ).innerHTML = `

        <div class="error">

            ❌ ${safe(message)}

        </div>

    `;

}

</script>

</body>
</html>
