<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYSHOP - Login</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Noto Sans Sinhala", sans-serif;
    background: #0b0b12;
    color: white;
    min-height: 100vh;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 7%;
    background: #11111b;
    border-bottom: 1px solid #292936;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #a855f7;
}

.language {
    background: #1d1d29;
    color: white;
    border: 1px solid #444;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.container {
    min-height: calc(100vh - 75px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
}

.login-box {
    width: 100%;
    max-width: 450px;
    background: #14141d;
    border: 1px solid #292936;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.login-box h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #9999a8;
    margin-bottom: 30px;
    line-height: 1.6;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #ddd;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    background: #0d0d14;
    color: white;
    border: 1px solid #353542;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #8b5cf6;
}

.login-btn {
    width: 100%;
    padding: 15px;
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: #7c3aed;
}

.login-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    text-align: center;
    font-size: 14px;
}

.success {
    display: block;
    background: #12351f;
    border: 1px solid #237a43;
    color: #7ee2a8;
}

.error {
    display: block;
    background: #351414;
    border: 1px solid #7a2323;
    color: #ff8f8f;
}

.register-text {
    text-align: center;
    margin-top: 22px;
    color: #9999a8;
    font-size: 14px;
}

.register-text a {
    color: #a855f7;
    text-decoration: none;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #777;
    text-decoration: none;
    font-size: 14px;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        MYSHOP
    </div>

    <button
        class="language"
        onclick="changeLanguage()"
        type="button"
    >
        🇬🇧 English
    </button>

</header>


<div class="container">

    <div class="login-box">

        <h1 id="title">
            පිවිසෙන්න
        </h1>

        <p class="subtitle" id="subtitle">
            ඔබේ MYSHOP ගිණුමට පිවිසෙන්න.
        </p>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="form-group">

                <label id="emailLabel">
                    📧 Gmail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <div class="form-group">

                <label id="passwordLabel">
                    🔐 Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                පිවිසෙන්න →
            </button>

        </form>


        <div class="register-text" id="registerText">

            ගිණුමක් නැද්ද?
            <a href="register.html">
                ගිණුමක් සාදන්න
            </a>

        </div>


        <a
            href="index.html"
            class="back"
            id="backHome"
        >
            ← මුල් පිටුවට
        </a>

    </div>

</div>


<script>

let sinhala = true;


/* =========================================
   LOGIN
========================================= */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document
        .getElementById("message");


    const loginButton =
        document
        .getElementById("loginButton");


    loginButton.disabled = true;


    loginButton.textContent =
        sinhala
        ? "⏳ පිවිසෙමින්..."
        : "⏳ Logging in...";


    message.style.display = "block";

    message.className =
        "message";

    message.textContent =
        sinhala
        ? "⏳ කරුණාකර රැඳී සිටින්න..."
        : "⏳ Please wait...";


    try {


        const response =
            await fetch(
                "https://myshop-api.oshadamilan2006.workers.dev/",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        action:
                            "login",

                        email:
                            email,

                        password:
                            password

                    })

                }
            );


        const result =
            await response.json();


        /* =========================
           SUCCESS
        ========================= */

        if (result.success) {


            message.className =
                "message success";


            message.textContent =
                sinhala
                ? "✅ සාර්ථකව පිවිසුණා!"
                : "✅ Login successful!";


            /*
             * Save logged-in business
             */

            localStorage.setItem(
                "myshop_business",
                JSON.stringify(
                    result.business
                )
            );


            /*
             * Dashboard එකට යන්න
             */

            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 700);

        }


        /* =========================
           ERROR
        ========================= */

        else {

            message.className =
                "message error";


            message.textContent =
                "❌ " +
                (
                    result.error ||
                    (
                        sinhala
                        ? "Login failed."
                        : "Login failed."
                    )
                );

        }


    }


    catch (error) {

        console.error(
            "Login error:",
            error
        );


        message.className =
            "message error";


        message.textContent =
            sinhala
            ? "❌ Server එකට සම්බන්ධ වීමට නොහැකි වුණා."
            : "❌ Could not connect to server.";

    }


    loginButton.disabled = false;


    loginButton.textContent =
        sinhala
        ? "පිවිසෙන්න →"
        : "Login →";

});


/* =========================================
   LANGUAGE
========================================= */

function changeLanguage() {

    sinhala = !sinhala;


    const button =
        document.querySelector(
            ".language"
        );


    if (sinhala) {

        document.documentElement.lang =
            "si";


        button.innerHTML =
            "🇬🇧 English";


        document.getElementById(
            "title"
        ).textContent =
            "පිවිසෙන්න";


        document.getElementById(
            "subtitle"
        ).textContent =
            "ඔබේ MYSHOP ගිණුමට පිවිසෙන්න.";


        document.getElementById(
            "emailLabel"
        ).textContent =
            "📧 Gmail";


        document.getElementById(
            "passwordLabel"
        ).textContent =
            "🔐 Password";


        document.getElementById(
            "loginButton"
        ).textContent =
            "පිවිසෙන්න →";


        document.getElementById(
            "registerText"
        ).innerHTML =
            'ගිණුමක් නැද්ද? <a href="register.html">ගිණුමක් සාදන්න</a>';


        document.getElementById(
            "backHome"
        ).textContent =
            "← මුල් පිටුවට";

    }


    else {

        document.documentElement.lang =
            "en";


        button.innerHTML =
            "🇱🇰 සිංහල";


        document.getElementById(
            "title"
        ).textContent =
            "Login";


        document.getElementById(
            "subtitle"
        ).textContent =
            "Login to your MYSHOP account.";


        document.getElementById(
            "emailLabel"
        ).textContent =
            "📧 Gmail";


        document.getElementById(
            "passwordLabel"
        ).textContent =
            "🔐 Password";


        document.getElementById(
            "loginButton"
        ).textContent =
            "Login →";


        document.getElementById(
            "registerText"
        ).innerHTML =
            'Don\'t have an account? <a href="register.html">Create an account</a>';


        document.getElementById(
            "backHome"
        ).textContent =
            "← Back to Home";

    }

}

</script>

</body>
</html>
