<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MYSHOP - Products</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Noto Sans Sinhala", sans-serif;
    background: #0b0b12;
    color: white;
    min-height: 100vh;
}

header {
    height: 70px;
    background: #11111b;
    border-bottom: 1px solid #292936;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #a855f7;
}

.back {
    color: #aaa;
    text-decoration: none;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 35px 20px;
}

.title {
    margin-bottom: 25px;
}

.title h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.title p {
    color: #9999a8;
}

.form-box {
    background: #14141d;
    border: 1px solid #292936;
    border-radius: 16px;
    padding: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #ddd;
}

input,
textarea {
    width: 100%;
    background: #0d0d14;
    color: white;
    border: 1px solid #353542;
    border-radius: 9px;
    padding: 13px;
    font-size: 15px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #8b5cf6;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

/* File input */

input[type="file"] {
    padding: 12px;
    cursor: pointer;
}

.preview-box {
    margin-top: 15px;
    display: none;
}

.preview-box img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid #353542;
}

.add-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #8b5cf6;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.add-button:hover {
    background: #7c3aed;
}

.message {
    display: none;
    padding: 13px;
    margin-bottom: 20px;
    border-radius: 9px;
    text-align: center;
}

.success {
    display: block;
    background: #12351f;
    border: 1px solid #237a43;
    color: #7ee2a8;
}

.error {
    display: block;
    background: #351414;
    border: 1px solid #7a2323;
    color: #ff8f8f;
}

.products-section {
    margin-top: 35px;
}

.products-section h2 {
    margin-bottom: 18px;
}

.product {
    background: #14141d;
    border: 1px solid #292936;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
}

.product-image {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
}

.product-price {
    color: #c084fc;
    margin-top: 6px;
}

.product-description {
    color: #9999a8;
    margin-top: 8px;
    line-height: 1.5;
}

.empty {
    color: #777;
    padding: 20px;
    text-align: center;
}

@media (max-width: 600px) {

    .container {
        padding: 25px 15px;
    }

    .form-box {
        padding: 22px;
    }

    .title h1 {
        font-size: 27px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        MYSHOP
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</header>


<div class="container">


    <div class="title">

        <h1>
            ➕ Product එකක් එකතු කරන්න
        </h1>

        <p>
            ඔබේ Online Store එකට products එකතු කරන්න.
        </p>

    </div>


    <div class="form-box">


        <div
            id="message"
            class="message"
        ></div>


        <form id="productForm">


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label>
                    🏷️ Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="උදා: T-Shirt"
                    required
                >

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label>
                    💰 Price (Rs.)
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="1500"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- STOCK -->

            <div class="form-group">

                <label>
                    📦 Stock
                </label>

                <input
                    type="number"
                    id="stock"
                    placeholder="10"
                    min="0"
                    value="0"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    📝 Description
                </label>

                <textarea
                    id="description"
                    placeholder="Product එක ගැන විස්තර..."
                ></textarea>

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label>
                    🖼️ Product Image
                </label>

                <input
                    type="file"
                    id="productImage"
                    accept="image/*"
                >

                <p style="
                    color:#777;
                    margin-top:8px;
                    font-size:13px;
                ">
                    Phone Gallery / Photos / Files වලින්
                    photo එකක් තෝරන්න.
                </p>


                <div
                    class="preview-box"
                    id="previewBox"
                >

                    <img
                        id="imagePreview"
                        alt="Image Preview"
                    >

                </div>

            </div>


            <!-- ADD BUTTON -->

            <button
                type="submit"
                class="add-button"
                id="addButton"
            >
                ➕ Product එක එකතු කරන්න
            </button>


        </form>

    </div>


    <!-- PRODUCTS -->

    <div class="products-section">

        <h2>
            🛍️ ඔබේ Products
        </h2>

        <div id="productList">

            <div class="empty">
                Products loading...
            </div>

        </div>

    </div>


</div>


<script>


const API =
    "https://myshop-api.oshadamilan2006.workers.dev/";


/* ==========================================
   CHECK LOGIN
========================================== */

const savedBusiness =
    localStorage.getItem(
        "myshop_business"
    );


if (!savedBusiness) {

    window.location.href =
        "login.html";

}


let business;


try {

    business =
        JSON.parse(savedBusiness);

}
catch (error) {

    localStorage.removeItem(
        "myshop_business"
    );

    window.location.href =
        "login.html";

}


/* ==========================================
   IMAGE SELECT + PREVIEW
========================================== */

const imageInput =
    document.getElementById(
        "productImage"
    );


const imagePreview =
    document.getElementById(
        "imagePreview"
    );


const previewBox =
    document.getElementById(
        "previewBox"
    );


imageInput.addEventListener(
    "change",
    function () {

        const file =
            this.files[0];


        if (!file) {

            previewBox.style.display =
                "none";

            imagePreview.src = "";

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "කරුණාකර image එකක් තෝරන්න."
            );

            this.value = "";

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function (event) {

                imagePreview.src =
                    event.target.result;

                previewBox.style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* ==========================================
   ADD PRODUCT
========================================== */

document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            const name =
                document
                .getElementById("name")
                .value
                .trim();


            const price =
                Number(
                    document
                    .getElementById("price")
                    .value
                );


            const stock =
                Number(
                    document
                    .getElementById("stock")
                    .value
                );


            const description =
                document
                .getElementById("description")
                .value
                .trim();


            const message =
                document
                .getElementById("message");


            const button =
                document
                .getElementById("addButton");


            button.disabled = true;

            button.textContent =
                "⏳ Saving...";


            try {


                /*
                 * දැනට image එක upload
                 * කරන්නේ නැහැ.
                 *
                 * Gallery එකෙන් select කරපු
                 * image එක preview වෙනවා.
                 */


                const response =
                    await fetch(
                        API,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    action:
                                        "add_product",

                                    business_id:
                                        business.id,

                                    name:
                                        name,

                                    price:
                                        price,

                                    stock:
                                        stock,

                                    description:
                                        description,

                                    image_url:
                                        ""

                                })

                        }
                    );


                const result =
                    await response.json();


                if (
                    result.success
                ) {

                    message.className =
                        "message success";

                    message.style.display =
                        "block";

                    message.textContent =
                        "✅ Product එක සාර්ථකව එකතු කළා!";


                    document
                        .getElementById(
                            "productForm"
                        )
                        .reset();


                    previewBox.style.display =
                        "none";

                    imagePreview.src = "";


                    document
                        .getElementById(
                            "stock"
                        )
                        .value = "0";


                    loadProducts();

                }
                else {

                    message.className =
                        "message error";

                    message.style.display =
                        "block";

                    message.textContent =
                        "❌ " +
                        (
                            result.error ||
                            "Product එක එකතු කරන්න බැරි වුණා."
                        );

                }


            }
            catch (error) {

                console.error(
                    error
                );


                message.className =
                    "message error";

                message.style.display =
                    "block";

                message.textContent =
                    "❌ Server එකට සම්බන්ධ වෙන්න බැරි වුණා.";

            }


            button.disabled =
                false;

            button.textContent =
                "➕ Product එක එකතු කරන්න";

        }
    );


/* ==========================================
   LOAD PRODUCTS
========================================== */

async function loadProducts() {


    const list =
        document
        .getElementById(
            "productList"
        );


    try {


        const response =
            await fetch(
                API,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "get_products",

                            business_id:
                                business.id

                        })

                }
            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.products ||
            result.products.length === 0
        ) {

            list.innerHTML =
                '<div class="empty">තවම Products නැහැ.</div>';

            return;

        }


        list.innerHTML = "";


        result.products.forEach(
            function (product) {


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "product";


                let imageHTML = "";


                if (
                    product.image_url
                ) {

                    imageHTML = `
                        <img
                            class="product-image"
                            src="${escapeHTML(product.image_url)}"
                            alt="${escapeHTML(product.name)}"
                        >
                    `;

                }


                div.innerHTML = `

                    ${imageHTML}

                    <div class="product-name">
                        ${escapeHTML(product.name)}
                    </div>

                    <div class="product-price">
                        Rs.
                        ${Number(product.price).toLocaleString()}
                    </div>

                    <div class="product-description">
                        ${escapeHTML(
                            product.description || ""
                        )}
                    </div>

                    <div style="
                        color:#777;
                        margin-top:8px;
                    ">
                        Stock:
                        ${product.stock}
                    </div>

                `;


                list.appendChild(
                    div
                );

            }
        );


    }
    catch (error) {

        console.error(
            error
        );


        list.innerHTML =
            '<div class="empty">Products load කරන්න බැරි වුණා.</div>';

    }

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================
   START
========================================== */

loadProducts();


</script>


</body>

</html>
